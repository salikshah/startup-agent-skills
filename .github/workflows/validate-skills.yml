name: Validate skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Spec compliance
        run: python tools/validate_skills.py

      - name: Benchmark skills
        run: python tools/benchmark.py

      - name: Static evals
        run: python tools/run_evals.py
